en:
  data:
    commands:
      description:
        ilogs: "show aos ilogs."
        yous: "show aos ilogs."
      usage:
        ilogs: "$ data ilogs"
        yous: "$ data yous"
    ilogs:
      display: "%{you} entered '%{cmd}' at %{timestamp} in %{pwd}."
    yous:
      display: "name: %{name}, access: %{access}, pwd: %{pwd}."
    messages:
      listing_ilogs: "listing aos input ilogs..."
      listing_yous: "listing yous..."
      no_ilogs: "no input ilogs."
      no_yous: "no yous."
    usage: |

      data [-h | --help] <command>
        aos data management.

      COMMANDS

        ilogs
          show aos ilogs.

        yous
          show aos yous.
